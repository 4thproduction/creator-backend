version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: rbac_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - rbac_network

  backend:
    build: ./backend
    container_name: rbac_backend
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=mongodb://mongodb:27017/rbac_db
    env_file:
      - ./backend/.env
    networks:
      - rbac_network

  frontend:
    build: ./frontend
    container_name: rbac_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - rbac_network

networks:
  rbac_network:
    driver: bridge

volumes:
  mongo_data:
